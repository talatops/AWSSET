version: '3.8'

services:
  # Frontend - React Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile  
      args:
        - REACT_APP_API_URL=http://localhost:8000
        - REACT_APP_WEBSOCKET_URL=ws://localhost:8000/ws/realtime
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WEBSOCKET_URL=ws://localhost:8000/ws/realtime
      - NODE_ENV=development
      - GENERATE_SOURCEMAP=false
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - awschatbot-network
    restart: unless-stopped

  # Backend - Python FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .docker.env
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    networks:
      - awschatbot-network
    restart: unless-stopped

  # Database - PostgreSQL
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=awschatbot_db
      - POSTGRES_USER=awschatbot
      - POSTGRES_PASSWORD=secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - awschatbot-network
    restart: unless-stopped

  # Redis - Caching and Session Storage
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - awschatbot-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Nginx - Reverse Proxy (Optional for production)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - awschatbot-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  awschatbot-network:
    driver: bridge
