# SonarQube Configuration for AWSSET Project
# This file configures SonarQube analysis for both Python backend and React frontend

# Project Information
sonar.projectKey=awsset
sonar.projectName=AWSSET
sonar.projectVersion=2.2.0
sonar.organization=talatops

# Source Code Configuration
sonar.sources=backend,frontend/src
sonar.tests=backend/tests,frontend/src

# Python Backend Configuration
sonar.python.version=3.9
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.xunit.reportPath=backend/test-results.xml

# JavaScript/React Frontend Configuration
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.javascript.coveragePlugin=lcov

# Exclusions - Files to ignore during analysis
sonar.exclusions=**/node_modules/**,**/__pycache__/**,**/*.pyc,**/venv/**,**/.env,**/dist/**,**/build/**,**/.git/**,**/logs/**,**/*.log

# Test Inclusions - Test files to include
sonar.test.inclusions=**/*test*.py,**/*.test.js,**/*.spec.js,**/tests/**,**/test_*.py

# Quality Gate Configuration
sonar.qualitygate.wait=true

# Analysis Configuration
sonar.sourceEncoding=UTF-8
sonar.python.coveragePlugin=coverage

# Security and Quality Rules
sonar.security.sources.python=backend
sonar.security.sources.javascript=frontend/src

# Coverage Thresholds
sonar.coverage.exclusions=**/tests/**,**/*test*.py,**/*.test.js,**/*.spec.js

# Duplicate Code Detection
sonar.cpd.python.minimumTokens=100
sonar.cpd.javascript.minimumTokens=100

# Language-specific Settings
sonar.python.pylint.reportPath=backend/pylint-report.txt
sonar.javascript.eslint.reportPaths=frontend/eslint-report.json

# Performance Settings
sonar.analysis.mode=publish
sonar.verbose=false
