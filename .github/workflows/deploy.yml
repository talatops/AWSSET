name: Deploy AWSSET v2.2.0 to Development

env:
  PROJECT_NAME: awsset-development
  REMOTE_DIR: /awsset-development
  # Version-specific deployment for v2.2.0 CloudTrail release

on:
  workflow_dispatch:
  push:
    # Trigger on specific release branch for v2.2.0 and general release branch
    branches: [release-2.2.0, release]
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - 'docs/'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - 'FEATURES_STATUS.md'
      - 'RELEASE_v2.2.0.md'

jobs:
  deploy:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY_DEVELOPMENT }}

      - name: Build and Deploy
        timeout-minutes: 45
        run: |
          # Create environment file
          echo "${{ secrets.ENV_DEVELOPMENT }}" > .docker.env
          echo "PROJECT_NAME=${{ env.PROJECT_NAME }}" >> .docker.env
          
          # Build images locally
          echo '🔨 Building frontend and backend images...'
          docker compose build --no-cache frontend backend
          
          # Pre-pull database images
          echo '📥 Pre-pulling database images...'
          docker pull postgres:15-alpine
          docker pull redis:7-alpine
          
          # Verify all images exist
          echo '✅ Images ready:'
          docker images | grep -E "(awsset|postgres|redis)"
          
          # Simple deployment - just start services
          echo '🚀 Starting services...'
          docker compose up -d
          
          # Wait for services to start
          echo '⏳ Waiting for services to start...'
          sleep 30
          
          # Check service status
          echo '🔍 Service status:'
          docker compose ps
          
          # Check if services are responding
          echo '🏥 Health check:'
          if curl -f http://localhost:3000 >/dev/null 2>&1; then
            echo '✅ Frontend is responding'
          else
            echo '❌ Frontend is not responding'
          fi
          
          if curl -f http://localhost:8000/api/health >/dev/null 2>&1; then
            echo '✅ Backend is responding'
          else
            echo '❌ Backend is not responding'
          fi
          
          # Cleanup
          rm -f .docker.env

      - name: Deployment Complete
        run: |
          echo '🚀 AWSSET deployed successfully!'
          echo '📍 Frontend: http://localhost:3000'
          echo '📍 Backend: http://localhost:8000'
          echo '🔧 To check logs: docker compose logs'

