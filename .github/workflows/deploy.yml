name: Deploy AWSSET v2.2.0 to Development

env:
  PROJECT_NAME: awsset-development
  REMOTE_DIR: /awsset-development
  # Version-specific deployment for v2.2.0 CloudTrail release

on:
  workflow_dispatch:
  push:
    # Trigger on specific release branch for v2.2.0 and general release branch
    branches: [release-2.2.0, release]
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - 'docs/'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - 'FEATURES_STATUS.md'
      - 'RELEASE_v2.2.0.md'

jobs:
  deploy:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY_DEVELOPMENT }}

      - name: Build and Deploy
        timeout-minutes: 30
        run: |
          # Create environment file
          echo "${{ secrets.ENV_DEVELOPMENT }}" > .docker.env
          echo "PROJECT_NAME=${{ env.PROJECT_NAME }}" >> .docker.env
          
          # Build images with explicit naming
          echo '🔨 Building frontend and backend images...'
          docker compose build --no-cache frontend backend
          
          # Check if any database images are being pulled
          echo '🔍 Checking for database images...'
          docker images | grep -E "(postgres|mysql|db|database)" || echo "No database images found"
          
          # Pre-pull database images to avoid timeouts during deployment
          echo '📥 Pre-pulling database images...'
          docker pull postgres:15-alpine || echo "Failed to pull postgres image"
          docker pull redis:7-alpine || echo "Failed to pull redis image"
          
          # Get image names with explicit format
          FRONTEND_IMAGE="awsset-frontend:latest"
          BACKEND_IMAGE="awsset-backend:latest"
          
          # Verify images exist
          if ! docker image inspect $FRONTEND_IMAGE >/dev/null 2>&1; then
            echo "❌ Frontend image not found: $FRONTEND_IMAGE"
            docker images | grep awsset
            exit 1
          fi
          
          if ! docker image inspect $BACKEND_IMAGE >/dev/null 2>&1; then
            echo "❌ Backend image not found: $BACKEND_IMAGE"
            docker images | grep awsset
            exit 1
          fi
          
          echo "✅ Images verified:"
          docker images | grep awsset
          
          # Save images with explicit names
          echo '💾 Saving frontend image...'
          docker save -o frontend.tar $FRONTEND_IMAGE
          
          echo '💾 Saving backend image...'
          docker save -o backend.tar $BACKEND_IMAGE
          
          echo '💾 Saving database images...'
          docker save -o postgres.tar postgres:15-alpine
          docker save -o redis.tar redis:7-alpine
          
          # Verify tar files
          echo '📋 Verifying tar files...'
          ls -la *.tar
          
          # Create combined archive
          echo '📦 Creating combined archive...'
          tar -czf images.tar frontend.tar backend.tar postgres.tar redis.tar
          
          # Deploy to server - Simplified commands
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=60 -o ServerAliveInterval=60 -o ServerAliveCountMax=3 ubuntu@${{ secrets.HOST_DEVELOPMENT }} "
            sudo usermod -aG docker ubuntu || true
            sudo chmod 666 /var/run/docker.sock || true
            sudo mkdir -p ${{ env.REMOTE_DIR }}
            sudo chown ubuntu:ubuntu ${{ env.REMOTE_DIR }}
            cd ${{ env.REMOTE_DIR }}
            docker compose down || true
            docker system prune -a -f || true
          "
          
          # Copy files
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=60 -o ServerAliveInterval=60 -o ServerAliveCountMax=3 images.tar docker-compose.yml .docker.env ubuntu@${{ secrets.HOST_DEVELOPMENT }}:${{ env.REMOTE_DIR }}/
          
          # Deploy on server - Simplified commands to avoid syntax issues
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=60 -o ServerAliveInterval=60 -o ServerAliveCountMax=3 ubuntu@${{ secrets.HOST_DEVELOPMENT }} "
            cd ${{ env.REMOTE_DIR }}
            
            # Extract and load images
            echo '📦 Extracting images...'
            tar -xzf images.tar
            
            echo '📥 Loading frontend image...'
            docker load -i frontend.tar
            
            echo '📥 Loading backend image...'
            docker load -i backend.tar
            
            echo '📥 Loading postgres image...'
            docker load -i postgres.tar
            
            echo '📥 Loading redis image...'
            docker load -i redis.tar
            
            # Verify images loaded
            echo '📦 Loaded images:'
            docker images | grep awsset
            echo '📦 Database images:'
            docker images | grep -E '(postgres|redis)'
            
            # Start services
            echo '🚀 Starting services...'
            docker compose up -d
            
            # Wait for services to start
            echo '⏳ Waiting for services to start...'
            sleep 15
            
            # Verify deployment
            echo '🔍 Checking deployment status:'
            docker compose ps
            
            # Check service health
            echo '🏥 Checking service health:'
            curl -f http://localhost:3000 >/dev/null 2>&1 && echo '✅ Frontend is responding' || echo '❌ Frontend is not responding'
            curl -f http://localhost:8000/api/health >/dev/null 2>&1 && echo '✅ Backend is responding' || echo '❌ Backend is not responding'
            
            # Cleanup
            rm -f frontend.tar backend.tar images.tar
            docker system prune -a -f
          "
          
          # Cleanup local files
          rm -f frontend.tar backend.tar images.tar .docker.env
          docker system prune -a -f

      - name: Deployment Complete
        run: |
          echo '🚀 AWSSET deployed successfully!'
          echo '📍 Frontend: http://${{ secrets.HOST_DEVELOPMENT }}'
          echo '📍 Backend: http://${{ secrets.HOST_DEVELOPMENT }}:8000'
          echo '🔧 To check logs: ssh ubuntu@${{ secrets.HOST_DEVELOPMENT }} "cd ${{ env.REMOTE_DIR }} && docker compose logs"'

