name: Deploy AWSSET v2.2.0 to Development

env:
  PROJECT_NAME: awsset-development
  REMOTE_DIR: /awsset-development
  # Version-specific deployment for v2.2.0 CloudTrail release

on:
  workflow_dispatch:
  push:
    # Trigger on specific release branch for v2.2.0 and general release branch
    branches: [release-2.2.0, release]
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - 'docs/'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - 'FEATURES_STATUS.md'
      - 'RELEASE_v2.2.0.md'

jobs:
  deploy:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY_DEVELOPMENT }}

      - name: Build and Deploy
        timeout-minutes: 45
        run: |
          # Create environment file
          echo "${{ secrets.ENV_DEVELOPMENT }}" > .docker.env
          echo "PROJECT_NAME=${{ env.PROJECT_NAME }}" >> .docker.env
          
          # Build images locally
          echo '🔨 Building frontend and backend images...'
          docker compose build --no-cache frontend backend
          
          # Pre-pull database images
          echo '📥 Pre-pulling database images...'
          docker pull postgres:15-alpine
          docker pull redis:7-alpine
          
          # Verify all images exist
          echo '✅ Images ready:'
          docker images | grep -E "(awsset|postgres|redis)"
          
          # Save images for transfer to EC2
          echo '💾 Saving images for EC2 deployment...'
          docker save -o frontend.tar awsset-frontend:latest
          docker save -o backend.tar awsset-backend:latest
          docker save -o postgres.tar postgres:15-alpine
          docker save -o redis.tar redis:7-alpine
          
          # Create deployment package
          echo '📦 Creating deployment package...'
          tar -czf deployment.tar frontend.tar backend.tar postgres.tar redis.tar docker-compose.yml .docker.env
          
          # Deploy to EC2 instance
          echo '🚀 Deploying to EC2 instance...'
          
          # Setup SSH connection
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 ubuntu@${{ secrets.HOST_DEVELOPMENT }} "
            # Stop existing services
            cd ${{ env.REMOTE_DIR }} || mkdir -p ${{ env.REMOTE_DIR }}
            docker compose down || true
            
            # Clean up old containers and images
            docker system prune -a -f || true
          "
          
          # Copy deployment package to EC2
          echo '📤 Copying files to EC2...'
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=30 deployment.tar ubuntu@${{ secrets.HOST_DEVELOPMENT }}:${{ env.REMOTE_DIR }}/
          
          # Deploy on EC2
          echo '🚀 Starting services on EC2...'
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 ubuntu@${{ secrets.HOST_DEVELOPMENT }} "
            cd ${{ env.REMOTE_DIR }}
            
            # Extract deployment package
            tar -xzf deployment.tar
            
            # Load Docker images
            echo '📥 Loading images...'
            docker load -i frontend.tar
            docker load -i backend.tar
            docker load -i postgres.tar
            docker load -i redis.tar
            
            # Start services
            echo '🚀 Starting services...'
            docker compose up -d
            
            # Wait for services
            echo '⏳ Waiting for services to start...'
            sleep 30
            
            # Check status
            echo '🔍 Service status:'
            docker compose ps
            
            # Health check
            echo '🏥 Health check:'
            curl -f http://localhost:3000 >/dev/null 2>&1 && echo '✅ Frontend is responding' || echo '❌ Frontend is not responding'
            curl -f http://localhost:8000/api/health >/dev/null 2>&1 && echo '✅ Backend is responding' || echo '❌ Backend is not responding'
            
            # Cleanup
            rm -f *.tar deployment.tar
          "
          
          # Cleanup local files
          rm -f *.tar deployment.tar .docker.env

      - name: Deployment Complete
        run: |
          echo '🚀 AWSSET deployed successfully to EC2!'
          echo '📍 Frontend: http://${{ secrets.HOST_DEVELOPMENT }}:3000'
          echo '📍 Backend: http://${{ secrets.HOST_DEVELOPMENT }}:8000'
          echo '🔧 To check logs: ssh ubuntu@${{ secrets.HOST_DEVELOPMENT }} "cd ${{ env.REMOTE_DIR }} && docker compose logs"'

