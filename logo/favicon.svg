<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Brain gradient: cyan to purple -->
    <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7B68EE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8A2BE2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Cloud gradient: blue to light blue -->
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#74B9FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0984E3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6C5CE7;stop-opacity:1" />
    </linearGradient>
    
    <!-- Neural network gradient -->
    <linearGradient id="neuralGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8A2BE2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" fill="#0F1419" rx="6"/>
  
  <!-- Brain-Cloud Fusion Icon (Center) -->
  <g transform="translate(16,16)">
    <!-- Cloud base that forms the brain shape -->
    <ellipse cx="0" cy="0" rx="12" ry="8" fill="url(#cloudGradient)"/>
    
    <!-- Cloud extensions that form brain lobes -->
    <ellipse cx="-8" cy="-3" rx="5" ry="4" fill="url(#cloudGradient)" opacity="0.9"/>
    <ellipse cx="8" cy="-3" rx="5" ry="4" fill="url(#cloudGradient)" opacity="0.9"/>
    <ellipse cx="0" cy="-7" rx="7" ry="5" fill="url(#cloudGradient)" opacity="0.95"/>
    <ellipse cx="0" cy="7" rx="7" ry="6" fill="url(#cloudGradient)" opacity="0.8"/>
    
    <!-- Brain folds integrated into cloud -->
    <path d="M-7,-5 Q-5,-7 -3,-7 Q-1,-7 0,-5" stroke="url(#neuralGradient)" stroke-width="1" fill="none" opacity="0.9"/>
    <path d="M-5,-3 Q-3,-5 -1,-5 Q1,-5 3,-3" stroke="url(#neuralGradient)" stroke-width="1" fill="none" opacity="0.9"/>
    <path d="M-3,-1 Q-1,-3 1,-3 Q3,-3 5,-1" stroke="url(#neuralGradient)" stroke-width="1" fill="none" opacity="0.9"/>
    
    <!-- Neural network nodes floating in the cloud -->
    <circle cx="-6" cy="-6" r="1" fill="url(#neuralGradient)" filter="url(#glow)"/>
    <circle cx="-4" cy="-4" r="1" fill="url(#neuralGradient)" filter="url(#glow)"/>
    <circle cx="-2" cy="-3" r="1" fill="url(#neuralGradient)" filter="url(#glow)"/>
    <circle cx="0" cy="-3" r="1" fill="url(#neuralGradient)" filter="url(#glow)"/>
    <circle cx="2" cy="-3" r="1" fill="url(#neuralGradient)" filter="url(#glow)"/>
    <circle cx="4" cy="-4" r="1" fill="url(#neuralGradient)" filter="url(#glow)"/>
    <circle cx="6" cy="-6" r="1" fill="url(#neuralGradient)" filter="url(#glow)"/>
    
    <!-- Neural connections -->
    <line x1="-6" y1="-6" x2="-4" y2="-4" stroke="url(#neuralGradient)" stroke-width="0.8" opacity="0.8"/>
    <line x1="-4" y1="-4" x2="-2" y2="-3" stroke="url(#neuralGradient)" stroke-width="0.8" opacity="0.8"/>
    <line x1="-2" y1="-3" x2="0" y2="-3" stroke="url(#neuralGradient)" stroke-width="0.8" opacity="0.8"/>
    <line x1="0" y1="-3" x2="2" y2="-3" stroke="url(#neuralGradient)" stroke-width="0.8" opacity="0.8"/>
    <line x1="2" y1="-3" x2="4" y2="-4" stroke="url(#neuralGradient)" stroke-width="0.8" opacity="0.8"/>
    <line x1="4" y1="-4" x2="6" y2="-6" stroke="url(#neuralGradient)" stroke-width="0.8" opacity="0.8"/>
    
    <!-- Lightning bolt inside -->
    <path d="M-1,-3 L0.5,-1 L-0.2,0 L1,3 L-0.5,1 L0.2,0 Z" fill="#FFE66D"/>
  </g>
</svg>
