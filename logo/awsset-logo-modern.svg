<svg width="240" height="80" viewBox="0 0 240 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern gradients -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9900;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B00;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="secondaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00A1F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099CC;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effects -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main Icon: AI Brain + AWS Cloud -->
  <g transform="translate(40,40)">
    <!-- AWS Cloud Base -->
    <ellipse cx="0" cy="0" rx="25" ry="15" fill="url(#secondaryGradient)" opacity="0.9"/>
    <ellipse cx="-15" cy="-8" rx="12" ry="8" fill="url(#secondaryGradient)" opacity="0.7"/>
    <ellipse cx="15" cy="-8" rx="12" ry="8" fill="url(#secondaryGradient)" opacity="0.7"/>
    <ellipse cx="-8" cy="8" rx="10" ry="6" fill="url(#secondaryGradient)" opacity="0.8"/>
    <ellipse cx="8" cy="8" rx="10" ry="6" fill="url(#secondaryGradient)" opacity="0.8"/>
    
    <!-- AI Brain Silhouette -->
    <g transform="translate(0,-5)">
      <!-- Brain lobes -->
      <path d="M-12,-8 Q-15,-12 -12,-16 Q-8,-18 -4,-16 Q-2,-14 -4,-12 Q-8,-10 -12,-8 Z" 
            fill="url(#accentGradient)"/>
      <path d="M12,-8 Q15,-12 12,-16 Q8,-18 4,-16 Q2,-14 4,-12 Q8,-10 12,-8 Z" 
            fill="url(#accentGradient)"/>
      <path d="M-8,-12 Q-10,-14 -8,-16 Q-6,-17 -4,-16 Q-3,-15 -4,-14 Q-6,-13 -8,-12 Z" 
            fill="url(#accentGradient)"/>
      <path d="M8,-12 Q10,-14 8,-16 Q6,-17 4,-16 Q3,-15 4,-14 Q6,-13 8,-12 Z" 
            fill="url(#accentGradient)"/>
      
      <!-- Neural network nodes -->
      <circle cx="-15" cy="-10" r="2" fill="#FF9900" filter="url(#glow)"/>
      <circle cx="15" cy="-10" r="2" fill="#FF9900" filter="url(#glow)"/>
      <circle cx="0" cy="-15" r="2" fill="#FF9900" filter="url(#glow)"/>
      <circle cx="-8" cy="-5" r="1.5" fill="#FF9900" filter="url(#glow)"/>
      <circle cx="8" cy="-5" r="1.5" fill="#FF9900" filter="url(#glow)"/>
      
      <!-- Connection lines -->
      <line x1="-15" y1="-10" x2="-8" y2="-5" stroke="#FF9900" stroke-width="1.5" opacity="0.8"/>
      <line x1="15" y1="-10" x2="8" y2="-5" stroke="#FF9900" stroke-width="1.5" opacity="0.8"/>
      <line x1="0" y1="-15" x2="-8" y2="-5" stroke="#FF9900" stroke-width="1.5" opacity="0.8"/>
      <line x1="0" y1="-15" x2="8" y2="-5" stroke="#FF9900" stroke-width="1.5" opacity="0.8"/>
    </g>
    
    <!-- AWS Arrow motif -->
    <g transform="translate(0,15)">
      <!-- Left arrow -->
      <path d="M-20,0 L-8,0 L-4,-3 L-8,-6 L-20,-6 Z" fill="url(#primaryGradient)"/>
      <polygon points="-4,-3 2,0 2,-6" fill="url(#primaryGradient)"/>
      
      <!-- Right arrow -->
      <path d="M20,0 L8,0 L4,-3 L8,-6 L20,-6 Z" fill="url(#primaryGradient)"/>
      <polygon points="4,-3 -2,0 -2,-6" fill="url(#primaryGradient)"/>
    </g>
  </g>
  
  <!-- Text: AWSSET -->
  <g transform="translate(100,25)">
    <!-- AWS -->
    <text x="0" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="url(#primaryGradient)">AWS</text>
    
    <!-- SET -->
    <text x="0" y="50" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#1F2937">SET</text>
  </g>
  
  <!-- Tagline -->
  <text x="100" y="65" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#6B7280" text-anchor="middle">AI-Powered Cloud Mastery</text>
</svg>
