<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9900;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="secondaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00A1F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099CC;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="16" cy="16" r="15" fill="url(#primaryGradient)" stroke="#232F3E" stroke-width="1"/>
  
  <!-- AWS Cloud Base -->
  <ellipse cx="16" cy="16" rx="12" ry="7" fill="url(#secondaryGradient)" opacity="0.9"/>
  <ellipse cx="10" cy="12" rx="6" ry="4" fill="url(#secondaryGradient)" opacity="0.7"/>
  <ellipse cx="22" cy="12" rx="6" ry="4" fill="url(#secondaryGradient)" opacity="0.7"/>
  
  <!-- AI Brain Silhouette -->
  <g transform="translate(16,12)">
    <!-- Brain lobes -->
    <path d="M-6,-4 Q-7,-6 -6,-8 Q-4,-9 -2,-8 Q-1,-7 -2,-6 Q-4,-5 -6,-4 Z" 
          fill="url(#accentGradient)"/>
    <path d="M6,-4 Q7,-6 6,-8 Q4,-9 2,-8 Q1,-7 2,-6 Q4,-5 6,-4 Z" 
          fill="url(#accentGradient)"/>
    
    <!-- Neural network nodes -->
    <circle cx="-7" cy="-5" r="1" fill="#FF9900"/>
    <circle cx="7" cy="-5" r="1" fill="#FF9900"/>
    <circle cx="0" cy="-7" r="1" fill="#FF9900"/>
  </g>
  
  <!-- AWS Arrow motif -->
  <g transform="translate(16,22)">
    <!-- Left arrow -->
    <path d="M-8,0 L-3,0 L-2,-1.5 L-3,-3 L-8,-3 Z" fill="url(#primaryGradient)"/>
    <polygon points="-2,-1.5 1,0 1,-3" fill="url(#primaryGradient)"/>
    
    <!-- Right arrow -->
    <path d="M8,0 L3,0 L2,-1.5 L3,-3 L8,-3 Z" fill="url(#primaryGradient)"/>
    <polygon points="2,-1.5 -1,0 -1,-3" fill="url(#primaryGradient)"/>
  </g>
</svg>
